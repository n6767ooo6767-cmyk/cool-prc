<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS ARENA</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#080b16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1b2350,#080b16 55%);display:flex;justify-content:center}.wrap{width:min(1100px,100%);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900;letter-spacing:3px}.stats{display:flex;gap:12px;flex-wrap:wrap}.pill,.panel{background:#11172a;border:1px solid #27304b;border-radius:14px;padding:10px 14px}.game{display:grid;grid-template-columns:1fr 300px;gap:14px}.arena{background:rgba(10,14,29,.88);border:1px solid #27304b;border-radius:20px;padding:18px;box-shadow:0 20px 70px #0008}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:650px;margin:auto}.cell{aspect-ratio:1;border:1px solid #303b5d;border-radius:13px;background:#151c31;display:grid;place-items:center;position:relative;cursor:pointer;transition:.15s}.cell:hover{transform:translateY(-2px);border-color:#6677c9}.unit{font-size:28px}.lvl{position:absolute;bottom:4px;right:6px;font-size:11px;color:#aab6e9}.enemy{margin:18px auto 12px;max-width:650px;height:16px;background:#262c3c;border-radius:99px;overflow:hidden}.enemy i{display:block;height:100%;width:100%;background:#e75b72;transition:.2s}.boss{text-align:center;font-weight:800}.side{display:flex;flex-direction:column;gap:14px}.big{font-size:28px;font-weight:900}.button{width:100%;padding:13px;border:0;border-radius:12px;background:#6677e8;color:white;font-weight:800;cursor:pointer}.button:disabled{opacity:.4;cursor:not-allowed}.hint{color:#9ba6c9;font-size:13px;line-height:1.5}.log{height:180px;overflow:auto;font:12px ui-monospace,monospace;color:#9eacd7}.over{position:fixed;inset:0;background:#050712dd;display:none;place-items:center}.over.show{display:grid}.modal{background:#12182b;border:1px solid #39476e;border-radius:20px;padding:30px;text-align:center;width:min(420px,90%)}@media(max-width:800px){.game{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.log{grid-column:1/-1}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">NEXUS / ARENA</div><div class="stats"><div class="pill">❤️ <b id="hp">100</b></div><div class="pill">⚡ <b id="mana">100</b></div><div class="pill">WAVE <b id="wave">1</b></div></div></div><div class="game"><section class="arena"><div class="boss">WAVE <span id="wave2">1</span> · ENEMIES <span id="count">5</span></div><div class="enemy"><i id="bar"></i></div><div class="board" id="board"></div></section><aside class="side"><div class="panel"><div class="big">⚡ <span id="cost">20</span></div><div class="hint">Вызывай случайного юнита. Одинаковых юнитов одного уровня можно объединять.</div><button class="button" id="summon">SUMMON</button></div><div class="panel"><b>КАК ИГРАТЬ</b><p class="hint">Кликай по клеткам, чтобы объединять одинаковых юнитов. Юниты автоматически атакуют врагов. Переживи 10 волн.</p></div><div class="panel log" id="log"></div></aside></div></div><div class="over" id="over"><div class="modal"><h1 id="result">VICTORY</h1><p id="resultText"></p><button class="button" onclick="location.reload()">PLAY AGAIN</button></div></div>
<script>
const board=document.querySelector('#board'), logEl=document.querySelector('#log');let cells=[],mana=100,hp=100,wave=1,enemies=5,enemyHp=100,dead=0,gameOver=false;
const icons=['🧙','🏹','⚡','🔥','❄️','🌿'];
function log(x){logEl.innerHTML='<div>› '+x+'</div>'+logEl.innerHTML}
function draw(){board.innerHTML='';cells.forEach((u,i)=>{let c=document.createElement('div');c.className='cell';if(u)c.innerHTML='<span class="unit">'+icons[u.type]+'</span><span class="lvl">Lv.'+u.level+'</span>';c.onclick=()=>clickCell(i);board.appendChild(c)})}
function summon(){if(gameOver||mana<20)return;mana-=20;let empty=cells.map((x,i)=>x?null:i).filter(x=>x!==null);if(!empty.length){log('Поле заполнено — сначала объедини юнитов');mana+=20;return}let i=empty[Math.floor(Math.random()*empty.length)];cells[i]={type:Math.floor(Math.random()*icons.length),level:1};log('Призван новый юнит');sync();draw()}
function clickCell(i){let u=cells[i];if(!u)return;let j=cells.findIndex((x,k)=>k!==i&&x&&x.type===u.type&&x.level===u.level);if(j<0)return;cells[j]={type:u.type,level:u.level+1};cells[i]=null;log('Объединение → Lv.'+(u.level+1));draw()}
function attack(){if(gameOver)return;let power=cells.reduce((s,u)=>s+(u?u.level*5:0),0);if(power)enemyHp-=power;if(enemyHp<=0){dead++;if(dead>=enemies){nextWave();return}enemyHp=100+wave*15}if(Math.random()<.08)hp-=Math.max(2,wave);if(hp<=0)finish(false);sync()}
function nextWave(){wave++;if(wave>10){finish(true);return}enemies=4+wave;enemyHp=100+wave*15;mana=Math.min(100,mana+35);log('Волна '+wave+' началась!');sync()}
function sync(){document.querySelector('#mana').textContent=Math.floor(mana);document.querySelector('#hp').textContent=Math.max(0,Math.floor(hp));document.querySelector('#wave').textContent=wave;document.querySelector('#wave2').textContent=wave;document.querySelector('#count').textContent=Math.max(0,enemies-dead);document.querySelector('#bar').style.width=Math.max(0,enemyHp/(100+wave*15)*100)+'%';document.querySelector('#summon').disabled=mana<20}
function finish(win){gameOver=true;document.querySelector('#result').textContent=win?'VICTORY 🏆':'DEFEATED';document.querySelector('#resultText').textContent=win?'Ты пережил все 10 волн!':'База уничтожена на волне '+wave+'.';document.querySelector('#over').classList.add('show')}
cells=Array(15).fill(null);draw();sync();document.querySelector('#summon').onclick=summon;setInterval(attack,1000);log('Система арены запущена');
</script></body></html>
